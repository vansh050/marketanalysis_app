name: iOS Submit for Review

# Sends a VALID TestFlight build (uploaded by ios-build.yml) to App Store
# review. Uses the same App Store Connect secrets as ios-build.yml.
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build number to submit (blank = newest VALID build)'
        required: false
        default: ''
      notes:
        description: "What's New text (ignored on an app's first version)"
        required: false
        default: ''
      replace_waiting:
        description: 'Cancel a submission already waiting for review and replace it'
        required: false
        default: 'false'
      manual_release:
        description: 'Hold for manual release after approval'
        required: false
        default: 'false'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_BUNDLE_ID: com.aq.marketanalysis
          IN_BUILD: ${{ inputs.build }}
          IN_NOTES: ${{ inputs.notes }}
          IN_REPLACE: ${{ inputs.replace_waiting }}
          IN_MANUAL: ${{ inputs.manual_release }}
        run: |
          set -euo pipefail
          pip install --quiet pyjwt cryptography
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$ASC_API_KEY" > "$ASC_KEY_PATH"
          args=()
          [ -n "$IN_BUILD" ] && args+=(--build "$IN_BUILD")
          [ -n "$IN_NOTES" ] && args+=(--notes "$IN_NOTES")
          [ "$IN_REPLACE" = "true" ] && args+=(--replace-waiting)
          [ "$IN_MANUAL" = "true" ] && args+=(--manual-release)
          python3 scripts/asc_submit.py "${args[@]}"
