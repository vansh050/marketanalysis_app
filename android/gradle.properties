# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m
org.gradle.java.home=/usr/local/Cellar/openjdk@17/17.0.17/libexec/openjdk.jdk/Contents/Home
#org.gradle.java.home=/usr/local/Cellar/openjdk@17/17.0.16/libexec/openjdk.jdk/Contents/Home
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.enableJetifier=true

# 16 KB page size support - REQUIRED for Google Play Store (Android 15+)
# This property ensures all native libraries support 16KB memory page sizes
android.native.enable16kPageSize=true

# Automatically convert third-party libraries to use AndroidX

APP_VARIANT=marketanalysis
# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true
# SIGNING (corrected 2026-07-21): marketanalysis signs with the SHARED upload
# key (`my-upload-key.keystore`, alias `my-key-alias-zamzam`) — the same cert
# used by Alphab2bapp / moneyman / zamzam / rgx / Kaizen. The previous values
# here (marketanalysis-upload-key.keystore / marketanalysis-key /
# marketanalysis123) named a key that exists NOWHERE and would fail the build.
# The keystore file is gitignored (see `*.keystore` in .gitignore); copy it into
# android/app/ from AlphaQuark/keys/marketanalysis/ before building.
# Passwords are intentionally NOT committed — they come from
# ~/.gradle/gradle.properties (the shared zamzam globals) or explicit -P:
#   ./gradlew bundleRelease \
#     -PMYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore \
#     -PMYAPP_UPLOAD_KEY_ALIAS=my-key-alias-zamzam \
#     -PMYAPP_UPLOAD_STORE_PASSWORD=zamzam12345 -PMYAPP_UPLOAD_KEY_PASSWORD=zamzam12345
# NOTE: user-home ~/.gradle values OVERRIDE these project values — that
# precedence broke markup's build 2026-07-20. Use -P when the globals are wrong.
# Signing: marketanalysis has its OWN upload key. Do NOT point these at
# my-upload-key.keystore — that file is a copy of the SHARED "zamzam" key
# (alias my-key-alias-zamzam, SHA1 C7:78:CD:34…) and Play rejects an upload
# signed with it: "expected D5:C6:3F… but got C7:78:CD…" (2026-07-21).
# The filename lies; only alias + SHA1 are truth. Verify before every release:
#   keytool -list -v -keystore android/app/marketanalysis-upload-key.keystore #     -storepass "$MYAPP_UPLOAD_KEY_PASSWORD" | grep -E 'Alias|SHA1'
#   => marketanalysis-key / D5:C6:3F:3F:57:53:22:49:91:87:6E:8D:4F:0B:43:79:26:FB:A1:6C
# Passwords are deliberately NOT stored here — pass them at build time:
#   ./gradlew bundleRelease -PMYAPP_UPLOAD_STORE_PASSWORD=… -PMYAPP_UPLOAD_KEY_PASSWORD=…
# Full matrix: prod-alphaquark-github/docs/MOBILE_SIGNING_KEYS.md
MYAPP_UPLOAD_STORE_FILE=marketanalysis-upload-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=marketanalysis-key
android.suppressUnsupportedCompileSdk=35
